name: Node.js CI

on:
  push:
    branches: ['develop']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
    steps:
      # Clean up workspace before checkout
      - name: Clean workspace
        run: |
          sudo rm -rf node_modules || true
          sudo rm -rf dist || true
          sudo rm -rf .env || true
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g pm2 yarn

      # Clear npm cache and install with proper permissions
      - name: Install dependencies
        run: |
          rm -rf node_modules || true
          yarn cache clean || true
          yarn install --frozen-lockfile

      # Debugging: Check if the secret is available
      - name: Debug Secret Length
        run: echo "PROD_ENV_FILE length ${#PROD_ENV_FILE}"
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}

      # Properly write the secret to the .env file (handles multiline secrets)
      - name: Create .env file
        run: |
          touch .env
          printf "%s" "${{ secrets.PROD_ENV_FILE }}" > .env

      # Verify that the .env file was created (remove or modify for security)
      - name: Verify .env file
        run: cat .env
      - name: Run prisma generate
        run: yarn run make:migration
      - name: Run build
        run: yarn run build
      - name: Run pm2 stop
        run: pm2 stop all
        continue-on-error: true
      - name: Run pm2 delete
        run: pm2 delete all
        continue-on-error: true
      - name: Run pm2 start
        run: yarn run start:prod

      # Fix permissions for next run
      - name: Fix workspace permissions
        if: always()
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
          sudo chmod -R u+w $GITHUB_WORKSPACE || true
        continue-on-error: true
